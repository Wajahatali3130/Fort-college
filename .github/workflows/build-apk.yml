name: Build Forte College APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/forte/college
          mkdir -p app/src/main/assets

          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/com/forte/college/
          cp index.html app/src/main/assets/

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.forte.college'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.forte.college'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Forte-College-APK
          path: app/build/outputs/apk/debug/app-debug.apk
